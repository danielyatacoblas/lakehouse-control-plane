plugins { id 'java'; id 'org.springframework.boot' version '3.5.4'; id 'io.spring.dependency-management' version '1.1.7' }
group='com.portfolio.lakehouse'; version='0.1.0-SNAPSHOT'
java { toolchain { languageVersion=JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencies {
 implementation 'org.springframework.boot:spring-boot-starter-web'
 implementation 'org.springframework.boot:spring-boot-starter-validation'
 implementation 'org.springframework.boot:spring-boot-starter-jdbc'
 implementation 'org.springframework.boot:spring-boot-starter-actuator'
 implementation 'org.flywaydb:flyway-core'
 implementation 'org.flywaydb:flyway-database-postgresql'
 runtimeOnly 'org.postgresql:postgresql'
 runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
 testImplementation 'org.springframework.boot:spring-boot-starter-test'
 testImplementation 'org.springframework.boot:spring-boot-testcontainers'
 testImplementation 'org.testcontainers:junit-jupiter'
 testImplementation 'org.testcontainers:postgresql'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs.addAll(['-parameters','-Xlint:all']) }
tasks.withType(Test).configureEach { useJUnitPlatform() }
springBoot { buildInfo() }
